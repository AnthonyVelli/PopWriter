<section class="state-container">
	<div>
	<h1>Screenplays</h1>
	<div ng-repeat="screenplay in screenplays">
		<h2>{{screenplay.title}}</h2>
		<button ui-sref="editor({id: screenplay._id})" type='btn btn-primary'>Edit {{screenplay.title}}</button>
	</div>
	<h2>Click to Add a Screenplay</h2>
		<button ui-sref="userHome.screenplays.add" type='btn btn-primary'>Add a Screenplay</button>
		<div>
		<form id="add-screenplay" name="addScreenplay" ng-submit="addNewScreenplay(user._id, newscreenplay)">
			<fieldset class="form-group">
		  		<label for="title">Title</label>
		  		<input type="text" ng-model="newscreenplay.title" ng-required="true" class="form-control" id="title" placeholder="Enter screenplay title here">
		  	</fieldset>
		  	<fieldset class="form-group">
			  	<label for="synopsis">Screenplay synopsis</label>
			  	<textarea class="form-control" id="synopsis" ng-model="newscreenplay.synopsis"  rows="4" placeholder="Enter screenplay synopsis here"></textarea>
		  	</fieldset>
		  	<button type="submit" class="btn btn-default">Add Screenplay</button>
		</form>
	</div>
	
</div>
</section>
